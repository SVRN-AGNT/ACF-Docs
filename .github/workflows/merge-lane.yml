# Merges a PR whose exact head both reviewers cleared, with no person typing
# "merge" (owner ruling 2026-10-16). Rules: Dale-OS ci/merge_gate.py. It wakes
# when a review or CI run finishes, so the CLEAR it reads is fresh.
name: merge-lane

on:
  workflow_run:
    workflows: [pm-review, agent-review, CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    # A dispatch on any other branch would run that branch's copy of this file,
    # with INTEGRATION_TOKEN and merge authority. Only the default branch's copy runs.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      actions: read
    uses: SVRN-AGNT/Dale-OS/.github/workflows/ci-merge-lane.yml@013ce6dfecc4eeb6326f1247397926255622cef1
    with:
      ref: 013ce6dfecc4eeb6326f1247397926255622cef1
      held_paths: '^\.github/workflows/'
    secrets:
      merge_token: ${{ secrets.INTEGRATION_TOKEN }}
