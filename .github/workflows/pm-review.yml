# Second-vendor PM: every Claude `HANDOFF:` on a PR gets a ruling from Codex's own
# GitHub review (the owner's ChatGPT plan, no API key), with no person relaying it.
# The HANDOFF asks Codex on its second line; the PM rules when Codex finishes that
# head. Shared workflow and rationale: Dale-OS ci/README.md ("The PM caller").
name: pm-review

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Id of an existing HANDOFF comment to review
        type: string
        required: true
      pr:
        description: The PR that comment is on (keys the same per-PR lock as comment events)
        type: string
        required: true

permissions:
  contents: read

jobs:
  pm:
    # A dispatch on any other branch would run that branch's copy of this file.
    # Codex's summary or receipt comment wakes the PM; GitHub alone can post as that app.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
      || (github.event.action == 'created' && startsWith(github.event.comment.body, 'HANDOFF:'))
      || (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && (contains(github.event.comment.body, 'codex-review-state:v1') || contains(github.event.comment.body, 'codex-review-receipt:v1')))
    # One run at a time per PR (comment events and dispatches share the key), so a HANDOFF and Codex
    # finishing never post two rulings. Job-level, so the PR's other comments never take the pending slot.
    concurrency:
      group: pm-review-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
      actions: read
    uses: SVRN-AGNT/Dale-OS/.github/workflows/ci-pm-review.yml@5a0ab6598ec6a2c1568d40d2340f51cc668863e2
    with:
      ref: 5a0ab6598ec6a2c1568d40d2340f51cc668863e2
      comment_id: ${{ github.event.comment.id || inputs.comment_id }}
      expected_pr: ${{ inputs.pr }}
      # CI and the PM's own caller are held: a PR that edits them gets the high bar.
      held_paths: '^\.github/workflows/'
      provider: chatgpt
