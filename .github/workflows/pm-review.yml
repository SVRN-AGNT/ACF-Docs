# Second-vendor PM: every Claude `HANDOFF:` on a PR gets an OpenAI review with
# no person relaying it. Shared workflow and rationale: Dale-OS ci/README.md
# ("The PM caller"). Needs the OPENAI_API_KEY repository secret.
name: pm-review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Id of an existing HANDOFF comment to review
        type: string
        required: true

permissions:
  contents: read

# One run per HANDOFF comment: a redelivered event never bills a second review.
concurrency:
  group: pm-review-${{ github.event.comment.id || inputs.comment_id }}
  cancel-in-progress: false

jobs:
  pm:
    # A dispatch on any other branch would run that branch's copy of this file.
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) || startsWith(github.event.comment.body, 'HANDOFF:')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    uses: Tataku/Dale-OS/.github/workflows/ci-pm-review.yml@1d63abd37314a79db64b4dace15f81ab0d80f938
    with:
      ref: 1d63abd37314a79db64b4dace15f81ab0d80f938
      comment_id: ${{ github.event.comment.id || inputs.comment_id }}
      # CI and the PM's own caller are held: a PR that edits them gets the high bar.
      held_paths: '^\.github/workflows/'
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
